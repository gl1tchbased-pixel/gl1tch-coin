name: CI

# Type-check and unit-test gate. The real production build/deploy runs on Vercel
# (site) and the Deploy-bot workflow (Railway), so CI keeps types and logic honest.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install (site)
        run: npm install --no-audit --no-fund
      - name: Type-check site
        run: npx tsc --noEmit
      - name: Test site
        run: npm test
      - name: Install (bot)
        run: cd bot && npm install --no-audit --no-fund
      - name: Type-check bot
        run: cd bot && npx tsc --noEmit
      - name: Test bot
        run: cd bot && npm test
