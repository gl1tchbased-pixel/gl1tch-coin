name: Deploy bot to Railway (legacy, manual only)

# The bot is moving to an Oracle Cloud VM that pulls main itself (bot/deploy/oracle). Pushes no
# longer deploy to Railway: two copies polling Telegram with the same token knock each other off.
# Kept as a manual fallback; uses the Railway account token in the RAILWAY_API_TOKEN secret.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-bot-railway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy bot
        working-directory: bot
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway link -p 04400e9d-1c8b-47ae-9df6-788897c90656 -e fce4a0ab-c9e6-49cd-8ef1-900ebebceca2 -s 99d8a4ee-39fe-4936-afb3-bd3988cfa91c
          railway up --ci
