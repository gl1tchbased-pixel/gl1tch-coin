name: Security

# Phase -1 (PREMIUM-PLAN-v3): secret-leak scan, dependency audit, and the core invariant
# check — no component may ever request a fund-transfer / approval signature.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: Secret leak scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fail on any NEW high/critical advisory in production deps. Two transitive
      # advisories from @solana/web3.js@1.x (no clean fix) are allow-listed and tracked
      # in docs/risk-register.md — they clear on the web3.js v2 migration.
      # Custom gate: fail on any NEW high/critical, allow-list the 2 known web3.js@1.x
      # transitive advisories (their cascade doesn't add new GHSA ids). See scripts/audit-gate.mjs
      # + docs/risk-register.md.
      - name: Dependency audit gate
        run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/audit-gate.mjs

  invariant:
    name: No fund/approval signature calls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Core invariant: GL1TCH only ever requests ownership-proving message signatures.
      # These calls move funds or grant allowances and must never appear in the app.
      - name: Grep for forbidden web3 calls
        run: |
          set -e
          PATTERN='eth_sendTransaction|sendTransaction\(|setApprovalForAll|increaseAllowance|\.approve\(|signAndSendTransaction'
          if grep -rEn --include=*.ts --include=*.tsx "$PATTERN" src bot/src 2>/dev/null; then
            echo "::error::Forbidden fund-transfer/approval call found — GL1TCH must only request ownership signatures (see docs/threat-model.md)."
            exit 1
          fi
          echo "OK — no fund-transfer/approval calls."

  attester:
    name: Signing confined to the memo-only attester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A3 verdict anchoring: bot/src/attest/ is the only code allowed to sign a transaction, and it may only build
      # SPL Memo transactions. Signing anywhere else, or a transfer/approval builder inside the attester, fails the
      # build. Test tools under bot/e2e/ run on devnet only and are outside both src trees. See docs/threat-model.md.
      - name: Signing lives only in bot/src/attest
        run: |
          set -e
          PATTERN='sendRawTransaction|sendAndConfirm|Keypair\.fromSecretKey|signTransaction|signAllTransactions|\.sign\(\['
          # grep exits 2 on a bad pattern; fail loudly instead of reading that as "no matches".
          grep -rEn --include=*.ts --include=*.tsx "$PATTERN" src bot/src > hits.txt || [ $? -eq 1 ]
          if grep -v '^bot/src/attest/' hits.txt; then
            echo "::error::Transaction signing outside bot/src/attest/ (the attester)."
            exit 1
          fi
          echo "OK — signing lives only in the attester."
          # Message signing (ed25519) by a key the bot holds belongs in the attester too; tests sign with throwaway keys.
          grep -rEn --include=*.ts 'sign\.detached\(' bot/src > msg-hits.txt || [ $? -eq 1 ]
          if grep -v '^bot/src/attest/' msg-hits.txt | grep -v '\.test\.ts:'; then
            echo "::error::Message signing outside bot/src/attest/ (the attester)."
            exit 1
          fi
          echo "OK — message signing lives only in the attester."
      - name: Attester builds memo instructions only
        run: |
          set -e
          PATTERN='SystemProgram|createTransfer|createApprove|createSetAuthority|createCloseAccount|createBurn|createMintTo|ComputeBudgetProgram'
          grep -rEn --include=*.ts "$PATTERN" bot/src/attest > hits.txt || [ $? -eq 1 ]
          if grep -v '\.test\.ts:' hits.txt; then
            echo "::error::The attester may only build SPL Memo instructions."
            exit 1
          fi
          echo "OK — the attester builds memo instructions only."
